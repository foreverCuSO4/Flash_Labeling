apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flash-labeling-prefix-redirect
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/permanent-redirect: /flash_labeling/
    nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # The rewrite on the other Ingress makes all locations on this host
          # regex locations. Anchor this redirect so it only matches the bare
          # prefix, not similarly named paths or application resources.
          - path: /flash_labeling$
            pathType: ImplementationSpecific
            backend:
              service:
                name: flash-labeling-app
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flash-labeling
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Require the slash: matching the bare prefix here would shadow its
          # redirect, leaving relative CSS/JS URLs pointing outside the app.
          - path: /flash_labeling/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: flash-labeling-app
                port:
                  name: http
