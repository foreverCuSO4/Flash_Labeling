apiVersion: apps/v1
kind: Deployment
metadata:
  name: flash-labeling-infer
  labels:
    app.kubernetes.io/name: flash-labeling-infer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flash-labeling-infer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flash-labeling-infer
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-npu-single
      terminationGracePeriodSeconds: 30
      containers:
        - name: inference
          image: flash-labeling-infer:local
          imagePullPolicy: Never
          command: ["/app/scripts/infer_entrypoint.sh"]
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: INFER_DEVICES
              value: "0"
            - name: INFER_REPLICAS
              value: "4"
            - name: INFER_PORT
              value: "8787"
            - name: INFER_OM_B16
              value: /app/data/om_models/model_b16.om
            - name: INFER_OM_B8
              value: /app/data/om_models/model_b8.om
            - name: INFER_MODEL_TAG
              value: gpu2_strict_best_snapshot
            - name: INFER_MODEL_DIR
              value: /app/data/models
          resources:
            requests:
              huawei.com/Ascend910: "1"
            limits:
              huawei.com/Ascend910: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: ascend
              mountPath: /usr/local/Ascend
              readOnly: true
            - name: om-models
              mountPath: /app/data/om_models
              readOnly: true
            - name: model-files
              mountPath: /app/data/models
              readOnly: true
            - name: inference-shm
              mountPath: /dev/shm
      volumes:
        - name: ascend
          hostPath:
            path: /usr/local/Ascend
            type: Directory
        - name: om-models
          hostPath:
            path: /data/users/zhujiayi/workspace/Flash_Labeling/data/om_models
            type: Directory
        - name: model-files
          hostPath:
            path: /home/zhujiayi/data/storage/flash_labeling/data/models
            type: DirectoryOrCreate
        - name: inference-shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: flash-labeling-infer
  labels:
    app.kubernetes.io/name: flash-labeling-infer
spec:
  type: ClusterIP
  # kube-proxy on this bare-metal cluster currently cannot program ClusterIP
  # rules. A headless Service makes the stable DNS name resolve directly to
  # the inference Pod, avoiding that broken virtual-IP hop.
  clusterIP: None
  selector:
    app.kubernetes.io/name: flash-labeling-infer
  ports:
    - name: http
      port: 8787
      targetPort: http
