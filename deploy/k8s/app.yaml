apiVersion: apps/v1
kind: Deployment
metadata:
  name: flash-labeling-app
  labels:
    app.kubernetes.io/name: flash-labeling-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: flash-labeling-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flash-labeling-app
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-npu-single
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: flash-labeling:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATA_DIR
              value: /app/data
            - name: ROOT_PATH
              value: /flash_labeling
            - name: INFER_URL
              value: http://flash-labeling-infer:8787
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flash-labeling-secrets
                  key: SECRET_KEY
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          volumeMounts:
            - name: app-data
              mountPath: /app/data
      volumes:
        - name: app-data
          hostPath:
            path: /home/zhujiayi/data/storage/flash_labeling/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: flash-labeling-app
  labels:
    app.kubernetes.io/name: flash-labeling-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flash-labeling-app
  ports:
    - name: http
      port: 8000
      targetPort: http
