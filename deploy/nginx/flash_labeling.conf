server {
    listen 80;
    listen [::]:80;
    server_name 60.165.239.63;

    location = /flash_labeling {
        return 301 /flash_labeling/;
    }

    # The trailing slash on proxy_pass removes /flash_labeling before
    # forwarding requests to the FastAPI process.
    location /flash_labeling/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /flash_labeling;

        # Video uploads use resumable chunks and may take a long time.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
