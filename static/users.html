<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.users">Users — Flash Labeling</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a class="logo" href="projects.html">Flash Labeling</a>
    <div class="nav-links">
      <a href="projects.html" data-i18n="nav.projects">Projects</a>
      <span id="userName" class="text-mute"></span>
      <img id="userAvatar" class="avatar avatar-sm" src="" alt="avatar">
      <button class="nav-btn" id="logoutBtn" data-i18n="nav.signOut">Sign Out</button>
      <label class="sr-only" for="languageSelect" data-i18n="language.label">Language</label>
      <select id="languageSelect" data-language-select data-i18n-aria-label="language.label"><option value="zh">中文</option><option value="en">English</option></select>
    </div>
  </nav>
  <div class="container">
    <div class="row-between mb-4">
      <h1 class="display-lg" data-i18n="users.heading">Users</h1>
    </div>
    <div id="userList" class="grid-auto"></div>
    <p id="emptyMsg" class="text-mute hidden" data-i18n="users.empty" style="text-align:center;padding:48px 0;">No registered users yet.</p>
  </div>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/users.js"></script>
</body>
</html>
