<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Flash Labeling</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a class="logo" href="/projects.html">Flash Labeling</a>
    <div class="nav-links">
      <a href="/users.html">Users</a>
      <span id="userName" class="text-mute"></span>
      <button class="avatar-btn" id="avatarBtn" title="Change avatar">
        <img id="userAvatar" class="avatar avatar-sm" src="" alt="avatar">
      </button>
      <button class="nav-btn" id="logoutBtn">Sign Out</button>
    </div>
    <input type="file" id="avatarInput" class="hidden" accept="image/png,image/jpeg,image/webp,image/bmp">
  </nav>
  <div class="container">
    <div class="row-between mb-4">
      <h1 class="display-lg">Projects</h1>
      <button class="btn btn-ghost-dark" id="newProjectBtn">New Project</button>
    </div>
    <div id="createPanel" class="panel mb-4 hidden">
      <h2 class="micro-cap mb-2">Create Project</h2>
      <form id="createForm" class="col">
        <div><label>Project Name</label><input type="text" id="projName" required></div>
        <div>
          <label>Annotation Mode</label>
          <div class="row">
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;">
              <input type="radio" name="mode" value="detection" checked style="width:auto"> Detection (bbox)
            </label>
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;">
              <input type="radio" name="mode" value="pose" style="width:auto"> Pose (keypoints)
            </label>
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;">
              <input type="radio" name="mode" value="segment" style="width:auto"> Segment (polygon)
            </label>
          </div>
        </div>
        <div><label>Classes (comma-separated)</label><input type="text" id="projClasses" placeholder="car, person, dog"></div>
        <div id="poseFields" class="hidden">
          <div><label>Keypoints (comma-separated, YOLO order)</label><input type="text" id="projKeypoints" placeholder="nose, left_eye, right_eye, left_shoulder, right_shoulder"></div>
          <div class="mt-2"><label>Skeleton Edges (e.g. 0-1, 1-3)</label><input type="text" id="projSkeleton" placeholder="0-1, 0-2, 1-3, 2-4"></div>
        </div>
        <button type="submit" class="btn btn-ghost-dark btn-sm" style="align-self:flex-start">Create</button>
        <p class="error hidden" id="createErr"></p>
      </form>
      <div style="border-top:1px solid var(--hairline-dark);margin-top:16px;padding-top:16px;">
        <h2 class="micro-cap mb-2">Or Create from dataset.yaml</h2>
        <form id="yamlForm" class="col">
          <div>
            <label>Upload a dataset.yaml file</label>
            <input type="file" id="yamlFile" accept=".yaml,.yml" required>
          </div>
          <div>
            <label>Project name (optional — inferred from the YAML)</label>
            <input type="text" id="yamlName">
          </div>
          <p class="text-mute" style="font-size:12px;margin:0;">Creates the project with classes (and mode) taken from the YAML. Images and labels are not imported — upload them from the project page afterwards.</p>
          <button type="submit" class="btn btn-ghost-dark btn-sm" style="align-self:flex-start">Create from YAML</button>
          <p class="error hidden" id="yamlErr"></p>
        </form>
      </div>
    </div>
    <div id="projectList" class="grid-auto"></div>
    <p id="emptyMsg" class="text-mute hidden" style="text-align:center;padding:48px 0;">No projects yet. Create one to get started.</p>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/projects.js"></script>
</body>
</html>
