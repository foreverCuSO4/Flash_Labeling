<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="title.projects">Projects — Flash Labeling</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="ascii-scene">
  <nav>
    <a class="logo" href="projects.html">Flash Labeling</a>
    <div class="nav-links">
      <a href="users.html" data-i18n="nav.users">Users</a>
      <span id="userName" class="text-mute"></span>
      <button class="avatar-btn" id="avatarBtn" data-i18n-title="nav.changeAvatar" title="Change avatar">
        <img id="userAvatar" class="avatar avatar-sm" src="" alt="avatar">
      </button>
      <button class="nav-btn" id="logoutBtn" data-i18n="nav.signOut">Sign Out</button>
      <label class="sr-only" for="languageSelect" data-i18n="language.label">Language</label>
      <select id="languageSelect" data-language-select data-i18n-aria-label="language.label"><option value="zh">中文</option><option value="en">English</option></select>
    </div>
    <input type="file" id="avatarInput" class="hidden" accept="image/png,image/jpeg,image/webp,image/bmp">
  </nav>
  <div class="container">
    <div class="row-between mb-4">
      <h1 class="display-lg" data-i18n="projects.heading">Projects</h1>
      <button class="btn btn-ghost-dark" id="newProjectBtn" data-i18n="projects.new">New Project</button>
    </div>
    <div id="createPanel" class="panel mb-4 hidden">
      <h2 class="micro-cap mb-2" data-i18n="projects.create">Create Project</h2>
      <form id="createForm" class="col">
        <div><label data-i18n="projects.name">Project Name</label><input type="text" id="projName" required></div>
        <div>
          <label data-i18n="projects.mode">Annotation Mode</label>
          <div class="row">
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;">
              <input type="radio" name="mode" value="detection" checked style="width:auto"> <span data-i18n="projects.detection">Detection (bbox)</span>
            </label>
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;">
              <input type="radio" name="mode" value="pose" style="width:auto"> <span data-i18n="projects.pose">Pose (keypoints)</span>
            </label>
            <label style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;">
              <input type="radio" name="mode" value="segment" style="width:auto"> <span data-i18n="projects.segment">Segment (polygon)</span>
            </label>
          </div>
        </div>
        <div><label data-i18n="projects.classes">Classes (comma-separated)</label><input type="text" id="projClasses" placeholder="car, person, dog"></div>
        <div id="poseFields" class="hidden">
          <div><label data-i18n="projects.keypoints">Keypoints (comma-separated, YOLO order)</label><input type="text" id="projKeypoints" placeholder="nose, left_eye, right_eye, left_shoulder, right_shoulder"></div>
          <div class="mt-2"><label data-i18n="projects.skeleton">Skeleton Edges (e.g. 0-1, 1-3)</label><input type="text" id="projSkeleton" placeholder="0-1, 0-2, 1-3, 2-4"></div>
        </div>
        <button type="submit" class="btn btn-ghost-dark btn-sm" data-i18n="projects.createAction" style="align-self:flex-start">Create</button>
        <p class="error hidden" id="createErr"></p>
      </form>
      <div style="border-top:1px solid var(--hairline-dark);margin-top:16px;padding-top:16px;">
        <h2 class="micro-cap mb-2" data-i18n="projects.yamlHeading">Or Create from dataset.yaml</h2>
        <form id="yamlForm" class="col">
          <div>
            <label data-i18n="projects.yamlFile">Upload a dataset.yaml file</label>
            <input type="file" id="yamlFile" accept=".yaml,.yml" required>
          </div>
          <div>
            <label data-i18n="projects.yamlName">Project name (optional — inferred from the YAML)</label>
            <input type="text" id="yamlName">
          </div>
          <p class="text-mute" data-i18n="projects.yamlHelp" style="font-size:12px;margin:0;">Creates the project with classes (and mode) taken from the YAML. Images and labels are not imported — upload them from the project page afterwards.</p>
          <button type="submit" class="btn btn-ghost-dark btn-sm" data-i18n="projects.createYaml" style="align-self:flex-start">Create from YAML</button>
          <p class="error hidden" id="yamlErr"></p>
        </form>
      </div>
    </div>
    <div id="projectList" class="grid-auto"></div>
    <p id="emptyMsg" class="text-mute hidden" data-i18n="projects.empty" style="text-align:center;padding:48px 0;">No projects yet. Create one to get started.</p>
  </div>
  <script src="js/api.js?v=20260913-3"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ascii-background.js"></script>
  <script src="js/projects.js?v=20260913-3"></script>
</body>
</html>
