<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annotate — Flash Labeling</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="overflow:hidden">
  <nav>
    <div class="row" style="gap:16px">
      <a class="logo" href="#" id="backLink">&larr; Back</a>
      <span class="micro-cap" id="imageName"></span>
    </div>
    <div class="nav-links">
      <span class="micro-cap text-mute" id="navInfo"></span>
      <button class="nav-btn" id="prevBtn">&larr; Prev</button>
      <button class="nav-btn" id="nextBtn">Next &rarr;</button>
    </div>
  </nav>
  <div class="annotate-layout">
    <div class="annotate-sidebar">
      <div>
        <p class="micro-cap mb-2">Classes</p>
        <div id="classList" class="col"></div>
        <p class="text-mute" style="font-size:12px;margin-top:8px;">Keys 1-8 to select</p>
      </div>
      <div>
        <p class="micro-cap mb-2">Boxes</p>
        <p id="boxCount" class="text-mute">0</p>
      </div>
      <div style="margin-top:auto" class="col">
        <button class="btn btn-ghost-dark btn-sm" id="saveBtn">Save (S)</button>
        <button class="btn btn-ghost-dark btn-sm" id="clearBtn">Clear All</button>
        <button class="btn btn-ghost-dark btn-sm" id="releaseBtn">Release Claim</button>
        <p class="error hidden" id="errMsg"></p>
        <p class="success hidden" id="okMsg"></p>
      </div>
    </div>
    <div class="annotate-canvas-wrap">
      <canvas id="annotCanvas"></canvas>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/annotate.js"></script>
</body>
</html>
